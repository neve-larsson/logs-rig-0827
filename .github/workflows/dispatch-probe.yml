name: dispatch-probe
run-name: ARM-${{ github.event_name }}-ref-${{ github.ref_name }}-sha-${{ github.sha }}
on:
  workflow_dispatch:
  repository_dispatch:
    types: [bb-probe]
  create:
  page_build:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "EVENT=$GITHUB_EVENT_NAME REF=$GITHUB_REF SHA=$GITHUB_SHA"
